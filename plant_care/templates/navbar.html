<nav class="navbar navbar-expand-xxl navbar-dark bg-success sticky-top">
    <div class="container">

        <a class="navbar-brand fw-bold" href="{% url 'plants:index' %}">
            <i class="bi bi-flower1 me-1"></i> PlantCare
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Відкрити меню">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active fw-semibold{% endif %}"
                       href="{% url 'plants:index' %}">
                        Головна
                    </a>
                </li>

                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' or request.resolver_match.url_name == 'plant_update' or request.resolver_match.url_name == 'plant_delete' %}active fw-semibold{% endif %}"
                           href="{% url 'plants:dashboard' %}">
                            Мої рослини
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'plant_create' %}active fw-semibold{% endif %}"
                           href="{% url 'plants:plant_create' %}">
                            Додати рослину
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'task_list' or request.resolver_match.url_name == 'task_create' or request.resolver_match.url_name == 'task_update' or request.resolver_match.url_name == 'task_delete' %}active fw-semibold{% endif %}"
                           href="{% url 'plants:task_list' %}">
                            Мої завдання
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'care_history' %}active fw-semibold{% endif %}"
                           href="{% url 'plants:care_history' %}">
                            Історія догляду
                        </a>
                    </li>
                {% endif %}
            </ul>

            <ul class="navbar-nav align-items-lg-center gap-2">
                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <span class="navbar-text me-lg-3">
                            <i class="bi bi-person-circle me-1"></i> {{ user.username }}
                        </span>
                    </li>

                    <li class="nav-item">
                        <form method="post" action="{% url 'plants:logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-light">
                                Вийти
                            </button>
                        </form>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'login' %}active fw-semibold{% endif %}"
                           href="{% url 'plants:login' %}">
                            Увійти
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'register' %}active fw-semibold{% endif %}"
                           href="{% url 'plants:register' %}">
                            Реєстрація
                        </a>
                    </li>
                {% endif %}
            </ul>

        </div>
    </div>
</nav>
